<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Kuaför Randevu Sistemi</title>
  <style>
    :root {
      --primary: #2c3e50;
      --secondary: #3498db;
      --success: #27ae60;
      --danger: #e74c3c;
      --light: #f8f9fa;
      --dark: #333;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { background-color: #f0f2f5; color: var(--dark); padding-bottom: 40px; }

    #loginScreen {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #1e3c72, #2a5298);
      padding: 20px;
    }
    .login-card {
      background: white;
      padding: 30px 20px;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.2);
      width: 100%;
      max-width: 380px;
      text-align: center;
    }
    .login-card h2 { margin-bottom: 20px; color: var(--primary); font-size: 24px; }
    .form-group { margin-bottom: 15px; text-align: left; }
    .form-group label { display: block; margin-bottom: 5px; font-weight: 600; font-size: 14px; color: #555; }
    .form-control {
      width: 100%;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 16px;
      outline: none;
      background: #fff;
    }
    .form-control:focus { border-color: var(--secondary); }

    input[type="date"]::-webkit-calendar-picker-indicator {
      background: transparent;
      bottom: 0;
      color: transparent;
      cursor: pointer;
      height: auto;
      left: 0;
      position: absolute;
      right: 0;
      top: 0;
      width: auto;
    }
    input[type="date"] { position: relative; }

    .btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      background: var(--secondary);
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn:active { background: #2980b9; }

    #appScreen { display: none; }
    header {
      background: var(--primary);
      color: white;
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      position: sticky;
      top: 0;
      z-index: 100;
      max-width: 600px;
      margin: 0 auto;
      border-bottom-left-radius: 10px;
      border-bottom-right-radius: 10px;
    }
    header h1 { font-size: 18px; }
    .header-btns { display: flex; gap: 8px; align-items: center; }
    
    .action-btn {
      background: var(--secondary);
      color: white;
      border: none;
      padding: 8px 14px;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      min-width: 75px;
      text-align: center;
    }
    .action-btn:active { background: #2980b9; }

    .container { padding: 15px; max-width: 600px; margin: 0 auto; }

    .card {
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
      margin-bottom: 20px;
    }
    .card h3 { margin-bottom: 15px; font-size: 18px; color: var(--primary); border-bottom: 2px solid #f0f2f5; padding-bottom: 8px; }

    .appointment-list { display: flex; flex-direction: column; gap: 10px; }
    .appointment-item {
      background: white;
      padding: 15px;
      border-radius: 10px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
      border-left: 5px solid var(--secondary);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .appointment-info div { font-size: 14px; margin-bottom: 3px; }
    .appointment-info .time { font-weight: bold; font-size: 15px; color: var(--primary); }
    .appointment-info .name { font-size: 16px; font-weight: bold; color: var(--dark); }
    
    .item-btns { display: flex; gap: 6px; }
    .call-btn {
      background: #e8f8f0;
      color: var(--success);
      border: none;
      padding: 8px 12px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      font-size: 14px;
    }
    .del-btn {
      background: #fde8e8;
      color: var(--danger);
      border: none;
      padding: 8px 12px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
    }

    #adminScreen { display: none; padding: 0 15px; max-width: 600px; margin: 0 auto; }
    .koltuk-row {
      background: #fff;
      padding: 15px;
      border-radius: 10px;
      margin-bottom: 15px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
      border-left: 5px solid #f39c12;
    }
    .koltuk-row label { font-size: 12px; font-weight: bold; color: #666; display: block; margin-top: 8px; margin-bottom: 2px; }
    .koltuk-row input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; margin-bottom: 5px; }
    .koltuk-row button { background: var(--success); color: white; border: none; padding: 12px; border-radius: 6px; font-weight: bold; width: 100%; margin-top: 10px; cursor: pointer; }

    #statsScreen { display: none; padding: 0 15px; max-width: 600px; margin: 0 auto; }
    .filter-group {
      display: flex;
      gap: 5px;
      overflow-x: auto;
      padding-bottom: 10px;
      margin-bottom: 15px;
    }
    .filter-btn {
      background: #e2e8f0;
      border: none;
      padding: 8px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      color: #4a5568;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s;
    }
    .filter-btn.active {
      background: var(--secondary);
      color: white;
    }
    .stat-table-card {
      background: white;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
      overflow: hidden;
      margin-bottom: 20px;
    }
    .stat-table {
      width: 100%;
      table-layout: fixed;
      border-collapse: collapse;
      text-align: left;
      font-size: 13px;
    }
    .stat-table th, .stat-table td {
      padding: 10px 8px;
      border-bottom: 1px solid #edf2f7;
      word-break: break-word;
      overflow: hidden;
    }
    .stat-table th {
      background: #f7fafc;
      color: var(--primary);
      font-weight: bold;
    }
    .stat-table tr:last-child td { border-bottom: none; }
    .error-msg { color: var(--danger); font-size: 14px; margin-top: 10px; text-align: center; }
  </style>
</head>
<body>

  <!-- GİRİŞ EKRANI -->
  <div id="loginScreen">
    <div class="login-card">
      <h2>Kuaför Girişi</h2>
      <div class="form-group">
        <label>Kullanıcı Adı</label>
        <input type="text" id="kadi" class="form-control" placeholder="ethem veya mustafa">
      </div>
      <div class="form-group">
        <label>Şifre</label>
        <input type="password" id="sifre" class="form-control" placeholder="1234">
      </div>
      <button class="btn" onclick="girisYap()">Giriş Yap</button>
      <div id="loginError" class="error-msg"></div>
    </div>
  </div>

  <!-- ANA PERSONEL EKRANI -->
  <div id="appScreen">
    <header>
      <h1 id="headerTitle">Yükleniyor...</h1>
      <div class="header-btns">
        <button id="yoneticiMenuBtn" class="action-btn" style="display:none;" onclick="yoneticiSayfasinaGit()">Yönetim</button>
        <button class="action-btn" onclick="cikisYap()">Çıkış</button>
      </div>
    </header>

    <div class="container">
      <div class="card">
        <h3>Yeni Randevu Ekle</h3>
        <div class="form-group">
          <label>Tarih</label>
          <input type="date" id="randevuTarih" class="form-control" onchange="saatleriGuncelle()">
        </div>
        <div class="form-group">
          <label>Randevu Saati</label>
          <select id="randevuSaat" class="form-control"></select>
        </div>
        <div class="form-group">
          <label>Müşteri Adı Soyadı</label>
          <input type="text" id="musteriAdi" class="form-control" placeholder="Müşteri adı yazın veya seçin" list="musteriListesi" oninput="musteriSecildi(this)">
          <datalist id="musteriListesi"></datalist>
        </div>
        <div class="form-group">
          <label>Telefon Numarası</label>
          <input type="tel" id="musteriTel" class="form-control" placeholder="0532 544 XX XX" maxlength="14" oninput="telefonFormatla(this)">
        </div>
        <button class="btn" onclick="randevuEkle()">Randevu Oluştur</button>
      </div>

      <div class="card">
        <h3>Randevularım</h3>
        <div id="randevuListesi" class="appointment-list"></div>
      </div>
    </div>
  </div>

  <!-- YÖNETİCİ PANELİ EKRANI -->
  <div id="adminScreen">
    <header>
      <h1>Yönetici Paneli</h1>
      <div class="header-btns">
        <button class="action-btn" onclick="istatistikSayfasinaGit()">İstatistik</button>
        <button class="action-btn" onclick="anaSayfayaDon()">Geri Dön</button>
      </div>
    </header>
    <div class="container" style="padding-top: 20px;">
      <p style="margin-bottom: 15px; color: #555; font-size: 14px;">Berber isimlerini, kullanıcı adlarını ve şifrelerini buradan düzenleyebilirsiniz.</p>
      <div id="koltuklarListesi"></div>
    </div>
  </div>

  <!-- İSTATİSTİKLER EKRANI -->
  <div id="statsScreen">
    <header>
      <h1>İstatistikler</h1>
      <div class="header-btns">
        <button class="action-btn" onclick="yoneticiSayfasinaGit()">Geri Dön</button>
      </div>
    </header>
    <div class="container" style="padding-top: 20px;">
      
      <div class="filter-group" id="filterGroup">
        <button class="filter-btn active" onclick="filtreDegistir('bugun', this)">Bugün</button>
        <button class="filter-btn" onclick="filtreDegistir('hafta', this)">Bu hafta</button>
        <button class="filter-btn" onclick="filtreDegistir('ay', this)">Bu ay</button>
        <button class="filter-btn" onclick="filtreDegistir('yil', this)">Bu yıl</button>
        <button class="filter-btn" onclick="filtreDegistir('tum', this)">Tüm zamanlar</button>
      </div>

      <div class="stat-table-card">
        <table class="stat-table" id="statsTableContent"></table>
      </div>

    </div>
  </div>

  <script>
    const API_URL = '';
    let currentUser = null;
    let aktifRandevular = [];
    let tumVeritabaniMusterileri = {}; 
    let tumPersonellerinRandevulari = {}; 
    let aktifIstatistikFiltresi = 'bugun';

    document.getElementById('randevuTarih').valueAsDate = new Date();

    function tarihNoktaliyeCevir(tarihStr) {
      if (!tarihStr) return '';
      let parcalar = tarihStr.split('-');
      if (parcalar.length === 3) {
        return `${parcalar[2]}.${parcalar[1]}.${parcalar[0]}`;
      }
      return tarihStr;
    }

    function telefonFormatla(input) {
      let val = input.value.replace(/\D/g, '');
      if (val.startsWith('0')) val = val.substring(1);
      if (val.length > 10) val = val.substring(0, 10);

      let formatted = '';
      if (val.length > 0) formatted = '0' + val.substring(0, 3);
      if (val.length >= 4) formatted += ' ' + val.substring(3, 6);
      if (val.length >= 7) formatted += ' ' + val.substring(6, 8);
      if (val.length >= 9) formatted += ' ' + val.substring(8, 10);
      input.value = formatted;
    }

    function saatleriGuncelle() {
      const saatSelect = document.getElementById('randevuSaat');
      const secilenTarihStr = document.getElementById('randevuTarih').value;
      
      saatSelect.innerHTML = '';

      let tumSaatler = [];
      for (let saat = 8; saat <= 23; saat++) {
        for (let dakika = 0; dakika < 60; dakika += 30) {
          if (saat === 8 && dakika === 0) continue;
          let s = saat < 10 ? '0' + saat : saat;
          let d = dakika === 0 ? '00' : '30';
          tumSaatler.push(`${s}:${d}`);
        }
      }

      const simdikiZaman = new Date();
      const bugunStr = simdikiZaman.toISOString().split('T')[0];
      
      const doluSaatler = aktifRandevular
        .filter(r => r.tarih === secilenTarihStr)
        .map(r => r.saat);

      let eklenenSayisi = 0;

      tumSaatler.forEach(saatStr => {
        if (doluSaatler.includes(saatStr)) return;

        if (secilenTarihStr === bugunStr) {
          let [h, m] = saatStr.split(':').map(Number);
          let randevuZamani = new Date();
          randevuZamani.setHours(h, m, 0, 0);

          if (randevuZamani <= simdikiZaman) return;
        }

        let opt = document.createElement('option');
        opt.value = saatStr;
        opt.textContent = saatStr;
        saatSelect.appendChild(opt);
        eklenenSayisi++;
      });

      if (eklenenSayisi === 0) {
        let opt = document.createElement('option');
        opt.value = "";
        opt.textContent = "Uygun saat kalmadı";
        saatSelect.appendChild(opt);
      }
    }

    async function girisYap() {
      const kadi = document.getElementById('kadi').value.trim();
      const sifre = document.getElementById('sifre').value.trim();
      const errorDiv = document.getElementById('loginError');

      errorDiv.innerText = "";
      if (!kadi || !sifre) {
        errorDiv.innerText = "Lütfen kullanıcı adı ve şifre girin!";
        return;
      }

      try {
        const response = await fetch(`${API_URL}/`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ islem: 'giris', kadi, sifre })
        });
        const data = await response.json();

        if (data.success) {
          currentUser = { kadi: kadi, gorunenAd: data.gorunenAd, sayfaAdi: data.sayfaAdi };
          localStorage.setItem('kuaforUser', JSON.stringify(currentUser));
          ekraniGuncelle();
        } else {
          errorDiv.innerText = data.message;
        }
      } catch (err) {
        errorDiv.innerText = "Sunucuya bağlanılamadı!";
      }
    }

    function ekraniGuncelle() {
      const saved = localStorage.getItem('kuaforUser');
      if (!saved) return;
      currentUser = JSON.parse(saved);

      document.getElementById('loginScreen').style.display = 'none';
      document.getElementById('adminScreen').style.display = 'none';
      document.getElementById('statsScreen').style.display = 'none';
      document.getElementById('appScreen').style.display = 'block';
      document.getElementById('headerTitle').innerText = currentUser.gorunenAd;

      randevulariGetir();

      if (currentUser.kadi.toLowerCase() === 'ethem') {
        document.getElementById('yoneticiMenuBtn').style.display = 'inline-block';
      }
    }

    function yoneticiSayfasinaGit() {
      document.getElementById('appScreen').style.display = 'none';
      document.getElementById('statsScreen').style.display = 'none';
      document.getElementById('adminScreen').style.display = 'block';
      personelleriGetir();
    }

    function anaSayfayaDon() {
      document.getElementById('adminScreen').style.display = 'none';
      document.getElementById('statsScreen').style.display = 'none';
      document.getElementById('appScreen').style.display = 'block';
      randevulariGetir();
    }

    async function istatistikSayfasinaGit() {
      document.getElementById('adminScreen').style.display = 'none';
      document.getElementById('statsScreen').style.display = 'block';
      await istatistikVerileriniHazirla();
    }

    async function randevulariGetir() {
      try {
        const res = await fetch(`${API_URL}/api/randevulariGetir?sayfa=${currentUser.sayfaAdi}`);
        let gelenRandevular = await res.json();
        
        // Müşteri listesini tüm berberlerin ortak kayıtlarından otomatik doldur
        const mRes = await fetch(`${API_URL}/api/tumMusterileriGetir`);
        let tumMusterilerDizi = await mRes.json();
        
        tumVeritabaniMusterileri = {};
        tumMusterilerDizi.forEach(m => {
          if (m.musteri && m.telefon) {
            tumVeritabaniMusterileri[m.musteri.toLowerCase()] = m.telefon;
          }
        });
        musteriListesiniDoldur();

        const simdikiZaman = new Date();
        
        aktifRandevular = gelenRandevular.filter(r => {
          if (!r.tarih || !r.saat) return false;
          let [yil, ay, gun] = r.tarih.split('-').map(Number);
          let [saat, dakika] = r.saat.split(':').map(Number);
          
          let randevuZamani = new Date(yil, ay - 1, gun, saat, dakika, 0);
          return randevuZamani >= simdikiZaman;
        });

        aktifRandevular.sort((a, b) => {
          let tarihKarsilastirma = a.tarih.localeCompare(b.tarih);
          if (tarihKarsilastirma !== 0) return tarihKarsilastirma;
          return a.saat.localeCompare(b.saat);
        });

        const container = document.getElementById('randevuListesi');
        
        if (aktifRandevular.length === 0) {
          container.innerHTML = '<p style="text-align:center; color:#888; padding:10px;">Henüz aktif randevu bulunmuyor.</p>';
        } else {
          container.innerHTML = aktifRandevular.map(r => {
            let telTemiz = r.telefon ? r.telefon.replace(/\s+/g, '') : '';
            let formatliTarih = tarihNoktaliyeCevir(r.tarih);
            return `
              <div class="appointment-item">
                <div class="appointment-info">
                  <div class="time">${formatliTarih} - ${r.saat}</div>
                  <div class="name">Müşteri: ${r.musteri}</div>
                  <div style="color:#666;">${r.telefon || 'Belirtilmemiş'}</div>
                </div>
                <div class="item-btns">
                  ${telTemiz ? `<a href="tel:${telTemiz}" class="call-btn">Ara</a>` : ''}
                  <button class="del-btn" onclick="randevuSil(${r.satir})">Sil</button>
                </div>
              </div>
            `;
          }).join('');
        }
        
        saatleriGuncelle();
      } catch (err) {
        console.error("Randevular alınamadı", err);
      }
    }

    function musteriListesiniDoldur() {
      const datalist = document.getElementById('musteriListesi');
      datalist.innerHTML = '';
      
      let benzersizIsimler = Object.keys(tumVeritabaniMusterileri);
      benzersizIsimler.forEach(isim => {
        let opt = document.createElement('option');
        opt.value = isim.charAt(0).toUpperCase() + isim.slice(1);
        datalist.appendChild(opt);
      });
    }

    function musteriSecildi(input) {
      let girilenIsim = input.value.trim().toLowerCase();
      let telInput = document.getElementById('musteriTel');
      
      if (tumVeritabaniMusterileri[girilenIsim]) {
        telInput.value = tumVeritabaniMusterileri[girilenIsim];
      }
    }

    async function randevuEkle() {
      const tarih = document.getElementById('randevuTarih').value;
      const saat = document.getElementById('randevuSaat').value;
      const musteri = document.getElementById('musteriAdi').value.trim();
      const telefon = document.getElementById('musteriTel').value.trim();

      if (!tarih || !saat || !musteri) {
        alert("Lütfen tarih, saat ve müşteri adı alanlarını doldurun!");
        return;
      }

      try {
        const res = await fetch(`${API_URL}/`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            islem: 'randevuEkle',
            sayfa: currentUser.sayfaAdi,
            tarih, saat, musteri, telefon,
            personel: currentUser.gorunenAd
          })
        });
        const data = await res.json();
        if (data.success) {
          document.getElementById('randevuTarih').valueAsDate = new Date();
          document.getElementById('musteriAdi').value = '';
          document.getElementById('musteriTel').value = '';
          randevulariGetir();
        }
      } catch (err) {
        alert("Randevu eklenirken hata oluştu.");
      }
    }

    async function randevuSil(satir) {
      if (!confirm("Bu randevuyu silmek istediğinize emin misiniz?")) return;
      try {
        const res = await fetch(`${API_URL}/`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ islem: 'sil', sayfa: currentUser.sayfaAdi, satir })
        });
        const data = await res.json();
        if (data.success) randevulariGetir();
      } catch (err) {
        alert("Silme işlemi başarısız.");
      }
    }

    async function personelleriGetir() {
      try {
        const res = await fetch(`${API_URL}/api/personelleriGetir`);
        const personeller = await res.json();
        const container = document.getElementById('koltuklarListesi');

        container.innerHTML = personeller.map(p => `
          <div class="koltuk-row">
            <label>Berber / Koltuk Adı:</label>
            <input type="text" id="ad_${p.sayfaAdi}" value="${p.gorunenAd || ''}">
            
            <label>Kullanıcı Adı:</label>
            <input type="text" id="kadi_${p.sayfaAdi}" value="${p.kacinci || ''}">
            
            <label>Şifre:</label>
            <input type="text" id="sifre_${p.sayfaAdi}" value="${p.sifre || ''}">
            
            <button onclick="personelGuncelle('${p.sayfaAdi}')">Bilgileri Güncelle</button>
          </div>
        `).join('');
      } catch (err) {
        console.error("Personeller alınamadı", err);
      }
    }

    async function personelGuncelle(sayfaAdi) {
      const yeniAd = document.getElementById(`ad_${sayfaAdi}`).value.trim();
      const yeniKadi = document.getElementById(`kadi_${sayfaAdi}`).value.trim();
      const yeniSifre = document.getElementById(`sifre_${sayfaAdi}`).value.trim();

      try {
        const res = await fetch(`${API_URL}/`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            islem: 'personelGuncelle',
            sayfaAdi: sayfaAdi,
            gorunenAd: yeniAd,
            kacinci: yeniKadi,
            sifre: yeniSifre
          })
        });
        const data = await res.json();
        if (data.success) {
          alert("Bilgiler başarıyla güncellendi!");
          personelleriGetir();
        }
      } catch (err) {
        alert("Güncelleme başarısız.");
      }
    }

    async function istatistikVerileriniHazirla() {
      try {
        const res = await fetch(`${API_URL}/api/personelleriGetir`);
        const personeller = await res.json();

        tumPersonellerinRandevulari = {};
        for (let p of personeller) {
          if (p.gorunenAd && p.gorunenAd.trim() !== '') {
            const rRes = await fetch(`${API_URL}/api/randevulariGetir?sayfa=${p.sayfaAdi}`);
            const rData = await rRes.json();
            tumPersonellerinRandevulari[p.sayfaAdi] = {
              gorunenAd: p.gorunenAd,
              randevular: rData
            };
          }
        }
        istatistikleriTabloyaBas();
      } catch (err) {
        console.error("İstatistik verileri alınamadı", err);
      }
    }

    function filtreDegistir(filtreTuru, btnElement) {
      aktifIstatistikFiltresi = filtreTuru;
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btnElement.classList.add('active');
      istatistikleriTabloyaBas();
    }

    function tarihFiltrele(randevular, tur) {
      const simdi = new Date();
      const bugunStr = `${simdi.getFullYear()}-${String(simdi.getMonth() + 1).padStart(2, '0')}-${String(simdi.getDate()).padStart(2, '0')}`;

      return randevular.filter(r => {
        if (!r.tarih) return false;

        if (tur === 'tum') {
          return true;
        } else if (tur === 'bugun') {
          return r.tarih === bugunStr;
        } else if (tur === 'hafta') {
          let [yil, ay, gun] = r.tarih.split('-').map(Number);
          let rDate = new Date(yil, ay - 1, gun);
          let day = simdi.getDay() || 7;
          let pzt = new Date(simdi);
          pzt.setDate(simdi.getDate() - day + 1);
          pzt.setHours(0,0,0,0);
          let pazar = new Date(pzt);
          pazar.setDate(pzt.getDate() + 6);
          pazar.setHours(23,59,59,999);
          return rDate >= pzt && rDate <= pazar;
        } else if (tur === 'ay') {
          let [yil, ay, gun] = r.tarih.split('-').map(Number);
          return yil === simdi.getFullYear() && ay === (simdi.getMonth() + 1);
        } else if (tur === 'yil') {
          let [yil, ay, gun] = r.tarih.split('-').map(Number);
          return yil === simdi.getFullYear();
        }
        return true;
      });
    }

    function gunAdiGetir(tarihStr) {
      if (!tarihStr) return '';
      let [yil, ay, gun] = tarihStr.split('-').map(Number);
      let d = new Date(yil, ay - 1, gun);
      let gunler = ['Paz', 'Pzt', 'Sal', 'Çar', 'Per', 'Cum', 'Cmt'];
      let gunIsmi = gunler[d.getDay()];
      let formatli = `${gun < 10 ? '0'+gun : gun}.${ay < 10 ? '0'+ay : ay}`;
      return `${formatli} (${gunIsmi})`;
    }

    function istatistikleriTabloyaBas() {
      const container = document.getElementById('statsTableContent');
      const personelKeyList = Object.keys(tumPersonellerinRandevulari);

      if (personelKeyList.length === 0) {
        container.innerHTML = '<tr><td style="padding:20px; text-align:center;">Veri bulunamadı.</td></tr>';
        return;
      }

      let colWidth = Math.floor(100 / (personelKeyList.length + 1));
      let colGroupHTML = `<colgroup><col style="width:${colWidth}%">`;
      personelKeyList.forEach(() => { colGroupHTML += `<col style="width:${colWidth}%">`; });
      colGroupHTML += '</colgroup>';

      let headerHTML = '<tr><th>İstatistikler</th>';
      personelKeyList.forEach(key => {
        headerHTML += `<th>${tumPersonellerinRandevulari[key].gorunenAd}</th>`;
      });
      headerHTML += '</tr>';

      let toplamIsSatir = '<tr><td><strong>Toplam iş</strong></td>';
      let enDoluGunSatir = '<tr><td><strong>En dolu gün</strong></td>';
      let enDoluSaatSatir = '<tr><td><strong>En dolu saat</strong></td>';

      personelKeyList.forEach(key => {
        let filtrelenmis = tarihFiltrele(tumPersonellerinRandevulari[key].randevular, aktifIstatistikFiltresi);
        
        let toplamIs = filtrelenmis.length;
        toplamIsSatir += `<td><span style="font-size:15px; font-weight:bold; color:var(--secondary);">${toplamIs}</span></td>`;

        let gunSayilari = {};
        filtrelenmis.forEach(r => { gunSayilari[r.tarih] = (gunSayilari[r.tarih] || 0) + 1; });
        let enDoluTarih = '';
        let maxGunSayisi = 0;
        for (let t in gunSayilari) {
          if (gunSayilari[t] > maxGunSayisi) {
            maxGunSayisi = gunSayilari[t];
            enDoluTarih = t;
          }
        }
        enDoluGunSatir += `<td>${enDoluTarih ? gunAdiGetir(enDoluTarih) : '-'}</td>`;

        let saatSayilari = {};
        filtrelenmis.forEach(r => {
          if (r.saat) { saatSayilari[r.saat] = (saatSayilari[r.saat] || 0) + 1; }
        });
        let enDoluSaat = '';
        let maxSaatSayisi = 0;
        for (let s in saatSayilari) {
          if (saatSayilari[s] > maxSaatSayisi) {
            maxSaatSayisi = saatSayilari[s];
            enDoluSaat = s;
          }
        }
        enDoluSaatSatir += `<td>${enDoluSaat ? enDoluSaat : '-'}</td>`;
      });

      toplamIsSatir += '</tr>';
      enDoluGunSatir += '</tr>';
      enDoluSaatSatir += '</tr>';

      container.innerHTML = colGroupHTML + headerHTML + toplamIsSatir + enDoluGunSatir + enDoluSaatSatir;
    }

    function cikisYap() {
      localStorage.removeItem('kuaforUser');
      location.reload();
    }

    if (localStorage.getItem('kuaforUser')) {
      ekraniGuncelle();
    }
  </script>
</body>
</html>
